:root {
  color-scheme: light;
  --body: #c9cac4;      /* shell plastic */
  --panel: #dadbd5;     /* raised panel */
  --ink: #141413;
  --muted: #55574f;
  --line: #a3a49d;
  --key: #1d1d1c;       /* black keys */
  --key-ink: #ecece6;
  --accent: #ff5a1a;    /* the one orange */
  --screen: #050505;
  --ok: #1d6b35;
  --err: #a8231a;
  --f-label: "Departure Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  --f-body: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 6px;
}
html, body { height: 100%; }
body {
  background: var(--body); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  display: flex; flex-direction: column; overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--body); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 12px; font-family: var(--f-label); text-transform: uppercase; letter-spacing: .08em; }
.brand b { font-weight: 400; font-size: 18px; }
.brand span { font-size: 11px; color: var(--muted); }
.brand .model { color: var(--accent); }
.meters { display: flex; gap: 14px; font-family: var(--f-label); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; }
.meters i { font-style: normal; color: var(--ink); }
.meters .credit { color: var(--muted); text-decoration: none; }
.meters .credit:hover i { color: var(--accent); }

.deck {
  flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bar select { flex: 1 1 220px; min-width: 0; }
.stage {
  flex: 1; min-height: 260px; position: relative; display: grid; place-items: center;
  background: #121211; border-radius: 10px; box-shadow: inset 0 0 0 1px #000, inset 0 2px 14px rgba(0,0,0,.6);
}
.frame { position: relative; background: var(--screen); box-shadow: 0 0 0 1px #2a2a28; }
.frame[data-kind="phone"] { border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 6px #232321, 0 0 0 7px #3a3a37; }
.frame canvas { display: block; font-family: "Geist Mono", ui-monospace, Menlo, Consolas, monospace; touch-action: none; }
.stage-label { position: absolute; left: 12px; bottom: 9px; font-family: var(--f-label); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #8d8e87; }
.stage-label b { font-weight: 400; color: #e9e9e3; }

.lbl { display: flex; align-items: center; gap: 6px; font-family: var(--f-label); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tag { font-size: 9px; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); letter-spacing: .04em; }

/* keys */
.key, select, .chip, .tab {
  border: 0; border-radius: var(--r); background: var(--key); color: var(--key-ink); padding: 7px 11px; cursor: pointer;
  font-family: var(--f-label); font-size: 12px; letter-spacing: .04em; box-shadow: 0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.08);
  transition: transform .06s, background .12s;
}
.key:active, .chip:active, .tab:active { transform: translateY(1px); box-shadow: 0 1px 0 #000; }
.key.on, .tab.on, .chip:hover { background: var(--accent); color: #140700; }
.key.wide { width: 100%; margin-top: 4px; }
select { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--key-ink) 50%), linear-gradient(135deg, var(--key-ink) 50%, transparent 50%); background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg .key { padding: 6px 9px; }

/* export */
.export { background: var(--panel); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 1px var(--line); }
.out-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.out-tabs .tab { flex: 1 1 0; min-width: 72px; }
#out-body { display: flex; flex-direction: column; gap: 10px; }
.row2 { display: flex; gap: 14px; flex-wrap: wrap; }
.row2 > div { display: flex; flex-direction: column; gap: 5px; }
#out-body > div > .lbl { margin-bottom: 5px; }
.steps { margin: 0; padding-left: 20px; color: var(--muted); max-width: 70ch; }
.steps li { margin: 2px 0; }
.url { display: flex; gap: 6px; align-items: center; min-width: 0; }
.url code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; background: #ecede8; border-radius: 4px; padding: 6px 8px; font-size: 12px; user-select: all; }
.go {
  align-self: flex-start; border: 0; border-radius: var(--r); padding: 10px 16px; cursor: pointer;
  background: var(--accent); color: #140700; font-family: var(--f-label); font-size: 13px; letter-spacing: .06em; text-transform: uppercase;
  box-shadow: 0 2px 0 #7a2600;
}
.go:disabled { opacity: .45; cursor: progress; }
.status-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-height: 22px; }
#status { margin: 0; flex: 1 1 240px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
#status[data-kind="ok"] { color: var(--ok); }
#status[data-kind="err"] { color: var(--err); }
.steps li, .hint, #status { overflow-wrap: anywhere; }
.lbl small { text-transform: none; letter-spacing: 0; font-family: var(--f-body); }
progress { width: 100%; height: 6px; appearance: none; border: 0; border-radius: 3px; background: #b9bab3; overflow: hidden; }
progress::-webkit-progress-bar { background: #b9bab3; }
progress::-webkit-progress-value { background: var(--accent); }
progress::-moz-progress-bar { background: var(--accent); }

/* rack */
.rack { background: var(--panel); border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 10px; border-bottom: 1px solid var(--line); }
.tabs .tab { padding: 8px 4px; font-size: 11px; text-transform: uppercase; }
.panel { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.ctl { display: flex; flex-direction: column; gap: 6px; }
.ctl-bool { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.ctl-bool .hint { flex-basis: 100%; }
.toggle { min-width: 52px; }
.hint { margin: 0; font-size: 12px; color: var(--muted); }
.note { margin: 0; font-size: 12px; padding: 8px 10px; border-radius: var(--r); background: #ecede8; color: var(--muted); }
.slide { display: flex; align-items: center; gap: 10px; }
.slide output { min-width: 54px; text-align: right; font-family: var(--f-label); font-size: 12px; font-variant-numeric: tabular-nums; }
input[type="range"] { flex: 1; min-width: 0; appearance: none; height: 22px; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: var(--ink); border-radius: 2px; }
input[type="range"]::-moz-range-track { height: 3px; background: var(--ink); border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; margin-top: -5.5px; background: var(--accent); border: 2px solid var(--ink); border-radius: 3px; }
input[type="range"]::-moz-range-thumb { width: 10px; height: 10px; background: var(--accent); border: 2px solid var(--ink); border-radius: 3px; }
.swatch { display: flex; align-items: center; gap: 10px; }
.swatch input { width: 44px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; }
.swatch code { font-family: var(--f-label); font-size: 12px; color: var(--muted); }
.looks { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { padding: 5px 9px; font-size: 11px; }

body.busy .rack { opacity: .6; pointer-events: none; }

@media (max-width: 900px) {
  body { overflow: auto; display: block; height: auto; }
  .deck { grid-template-columns: minmax(0, 1fr); }
  .stage { height: min(68vh, calc((100vw - 64px) * var(--ratio, .5625) + 70px)); flex: none; min-height: 200px; }
  .rack { max-height: none; }
  .panel { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { .key, .chip, .tab { transition: none; } }
</style>

<header class="top">
  <div class="brand"><b>ASCII Sharks</b><span>Wallpaper studio</span><span class="model">AS-02</span></div>
  <div class="meters"><span>Engine <i id="backend">…</i></span><span>Preview <i id="fps">– fps</i></span><span>Output <i id="res">–</i></span><a class="credit" href="https://github.com/stackedlol/ascii-sharks" target="_blank" rel="noopener noreferrer">after <i>stackedlol</i></a></div>
</header>

<main class="deck">
  <section class="screen-col" aria-label="Preview and export">
    <div class="bar">
      <select id="device" aria-label="Screen to design for"></select>
      <button type="button" class="key" id="pause" aria-pressed="false">Pause</button>
      <button type="button" class="key" id="shuffle">New scene</button>
      <button type="button" class="key" id="reset">Reset all</button>
    </div>
    <div class="stage" id="stage">
      <div class="frame" id="frame"><canvas id="preview" aria-label="Live preview of the shark wallpaper"></canvas></div>
      <div class="stage-label">Preview · <b id="dev-name">–</b> · move the cursor over the water, click to splash</div>
    </div>
    <section class="export" aria-label="Export">
      <div class="out-tabs" id="out-tabs" role="tablist">
        <button type="button" class="tab" role="tab" data-o="live">Live wallpaper</button>
        <button type="button" class="tab" role="tab" data-o="video">Video loop</button>
        <button type="button" class="tab" role="tab" data-o="image">Still image</button>
        <button type="button" class="tab" role="tab" data-o="other">Other</button>
      </div>
      <div id="out-body"></div>
      <progress id="progress" max="1" value="0" hidden></progress>
      <div class="status-row">
        <p id="status" role="status" aria-live="polite">Pick a screen, shape the sharks on the right, then export.</p>
        <button type="button" class="key" id="cancel" hidden>Cancel</button>
        <button type="button" class="go" id="save-video" hidden>Save video</button>
      </div>
    </section>
  </section>

  <aside class="rack" aria-label="Settings">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="panel" id="panel"></div>
  </aside>
</main>
<script src="app.js"></script>

</body></html>
